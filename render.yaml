# Render Blueprint: provisions the database, API, language service and static frontend.
# Deploy by connecting this repo at https://dashboard.render.com/blueprints.
# Service names below are used to build cross-service URLs; if Render appends a suffix
# because a name is taken, update the matching *_URL / AllowedOrigins values. See docs/DEPLOY.md.

databases:
  - name: meinedeutschelehrerin-db
    databaseName: meinedeutschelehrerin
    user: mdl
    plan: free
    region: frankfurt

services:
  # ---- .NET API ----
  - type: web
    name: meinedeutschelehrerin-api
    runtime: docker
    dockerfilePath: ./src/MeineDeutscheLehrerin.Api/Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: Database__Provider
        value: Postgres
      - key: ConnectionStrings__Default
        fromDatabase:
          name: meinedeutschelehrerin-db
          property: connectionString
      - key: Identity__RequireConfirmedEmail
        value: "false"
      - key: Seed__ImportContent
        value: "true"
      - key: Admin__Email      # set to seed an admin account (no admin is created if unset)
        sync: false
      - key: Admin__Password   # use a strong password; the admin can log in at /login then open /admin
        sync: false
      - key: Cors__AllowedOrigins__0
        value: https://meinedeutschelehrerin.onrender.com
      - key: LanguageService__BaseUrl
        value: https://meinedeutschelehrerin-ai.onrender.com

  # ---- Python language service (writing/speaking feedback) ----
  - type: web
    name: meinedeutschelehrerin-ai
    runtime: docker
    dockerfilePath: ./language-service/Dockerfile
    dockerContext: ./language-service
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: ANTHROPIC_API_KEY   # optional; set in the dashboard to enable real AI feedback
        sync: false
      - key: LLM_MODEL
        value: claude-sonnet-4-6
      # Grammar RAG: the vector index lives in the same Postgres via pgvector, so it survives
      # the free-tier restarts that would otherwise force a re-embed on every boot.
      - key: RAG_DATABASE_URL
        fromDatabase:
          name: meinedeutschelehrerin-db
          property: connectionString
      - key: VOYAGE_API_KEY      # optional; without it retrieval uses the offline hashing embedder
        sync: false
      # Study Coach (multi-agent) uses the same DB for its LangGraph checkpointer (per-thread
      # memory that survives restarts).
      - key: COACH_DATABASE_URL
        fromDatabase:
          name: meinedeutschelehrerin-db
          property: connectionString
      # LLMOps: set both to stream agent traces to LangSmith. Left unset, the coach still runs
      # and reports per-turn latency/token/prompt-version metrics locally.
      - key: LANGSMITH_TRACING    # set to "true" in the dashboard to enable tracing
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: meinedeutschelehrerin-coach
      # LLM provider gateway: fallback order and per-provider keys. Anthropic is primary; add an
      # OpenAI key (and/or an OLLAMA_BASE_URL) to enable fallback routing. Unset providers are
      # skipped, so this is safe with only ANTHROPIC_API_KEY set.
      - key: LLM_PROVIDERS
        value: anthropic,openai,ollama
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OLLAMA_BASE_URL   # optional; point at a self-hosted open-source model
        sync: false

  # ---- React static frontend ----
  - type: web
    name: meinedeutschelehrerin
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://meinedeutschelehrerin-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
